<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Reservation flow diagram</title>
  <desc id="desc">User sends reserve request, API performs atomic database update, creates reservation, commits, and emits stock update.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.ok{fill:#ecfdf5;stroke:#047857;stroke-width:2}.fail{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.text{font:600 15px Arial,sans-serif;fill:#111827}.small{font:500 13px Arial,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="430" rx="24"/>
  <rect class="box" x="40" y="70" width="160" height="70" rx="14"/><text class="text" x="120" y="110" text-anchor="middle">Browser</text>
  <rect class="box" x="280" y="70" width="170" height="70" rx="14"/><text class="text" x="365" y="110" text-anchor="middle">Express API</text>
  <rect class="box" x="530" y="70" width="190" height="70" rx="14"/><text class="text" x="625" y="110" text-anchor="middle">PostgreSQL</text>
  <rect class="box" x="790" y="70" width="150" height="70" rx="14"/><text class="text" x="865" y="110" text-anchor="middle">Socket.io</text>
  <path class="line" d="M200 105 L280 105"/><text class="small" x="218" y="92">POST reserve</text>
  <path class="line" d="M450 105 L530 105"/><text class="small" x="455" y="92">BEGIN</text>
  <rect class="ok" x="300" y="185" width="360" height="62" rx="14"/><text class="text" x="480" y="212" text-anchor="middle">Atomic stock decrement</text><text class="small" x="480" y="234" text-anchor="middle">UPDATE Drop WHERE availableStock &gt; 0</text>
  <path class="line" d="M625 140 L535 185"/>
  <rect class="ok" x="300" y="275" width="360" height="62" rx="14"/><text class="text" x="480" y="302" text-anchor="middle">Create ACTIVE reservation</text><text class="small" x="480" y="324" text-anchor="middle">expiresAt = now + 60 seconds</text>
  <path class="line" d="M480 247 L480 275"/>
  <path class="line" d="M660 306 C755 300 770 190 790 125"/><text class="small" x="700" y="276">emit stock update</text>
  <path class="line" d="M300 336 C210 350 170 250 142 140"/><text class="small" x="142" y="360">201 reservationId</text>
  <rect class="fail" x="690" y="275" width="230" height="62" rx="14"/><text class="text" x="805" y="302" text-anchor="middle">No row returned</text><text class="small" x="805" y="324" text-anchor="middle">409 DROP_SOLD_OUT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">System architecture diagram</title>
  <desc id="desc">React dashboard communicates with Express API over HTTP and Socket.io. Express uses Prisma to write PostgreSQL. An expiration worker also uses Prisma and emits Socket.io events.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.dark{fill:#111827;stroke:#111827}.worker{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.db{fill:#ecfdf5;stroke:#047857;stroke-width:2}.text{font:600 16px Arial,sans-serif;fill:#111827}.small{font:500 13px Arial,sans-serif;fill:#475569}.white{fill:#fff}.line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="980" height="360" rx="24" />
  <rect class="box" x="50" y="110" width="180" height="82" rx="16" />
  <text class="text" x="140" y="145" text-anchor="middle">React Dashboard</text>
  <text class="small" x="140" y="170" text-anchor="middle">Vite + TanStack Query</text>
  <rect class="box" x="315" y="50" width="180" height="82" rx="16" />
  <text class="text" x="405" y="85" text-anchor="middle">Express API</text>
  <text class="small" x="405" y="110" text-anchor="middle">REST writes</text>
  <rect class="dark" x="315" y="190" width="180" height="82" rx="16" />
  <text class="text white" x="405" y="225" text-anchor="middle">Socket.io Server</text>
  <text class="small white" x="405" y="250" text-anchor="middle">Realtime broadcasts</text>
  <rect class="box" x="585" y="50" width="180" height="82" rx="16" />
  <text class="text" x="675" y="85" text-anchor="middle">Prisma Client</text>
  <text class="small" x="675" y="110" text-anchor="middle">ORM + transactions</text>
  <rect class="db" x="585" y="205" width="180" height="88" rx="44" />
  <text class="text" x="675" y="242" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="675" y="267" text-anchor="middle">Source of truth</text>
  <rect class="worker" x="800" y="110" width="140" height="82" rx="16" />
  <text class="text" x="870" y="145" text-anchor="middle">Expiration</text>
  <text class="small" x="870" y="170" text-anchor="middle">Worker</text>
  <path class="line" d="M230 132 C265 110 280 96 315 92" />
  <text class="small" x="265" y="94">HTTP API</text>
  <path class="line" d="M230 178 C265 205 280 224 315 228" />
  <text class="small" x="248" y="220">Socket.io</text>
  <path class="line" d="M495 91 L585 91" />
  <path class="line" d="M675 132 L675 205" />
  <path class="line" d="M800 151 C780 120 760 102 765 96" />
  <path class="line" d="M800 180 C690 305 520 293 495 252" />
  <text class="small" x="526" y="175">emit after commit</text>
</svg>
